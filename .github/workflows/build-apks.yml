name: Build GameNet Manager APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build User and Admin APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build User Client APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Admin Panel APK
        run: ./gradlew :admin:assembleDebug --no-daemon

      - name: Copy and Rename APKs
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/GameNet_Manager_User.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk build-artifacts/GameNet_Manager_Admin.apk

      - name: Upload Built APKs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GameNet-Manager-Latest-APKs
          path: build-artifacts/
          retention-days: 30
