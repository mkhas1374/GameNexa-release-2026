name: GameNexa Android Release Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Check Android/backend API contract
        run: python3 tests/android_backend_contract_check.py

      - name: Run JVM tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Create ephemeral CI release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/gamenexa-ci-release.jks" \
            -storepass gamenexa-ci-store \
            -keypass gamenexa-ci-key \
            -alias gamenexa-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=GameNexa CI Validation, OU=Build, O=GameNexa, C=XX"

      - name: Build Release AAB with ephemeral validation signing
        env:
          GAMENEXA_KEYSTORE_PATH: ${{ runner.temp }}/gamenexa-ci-release.jks
          GAMENEXA_STORE_PASSWORD: gamenexa-ci-store
          GAMENEXA_KEY_ALIAS: gamenexa-ci
          GAMENEXA_KEY_PASSWORD: gamenexa-ci-key
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GameNexa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload Release Validation AAB
        uses: actions/upload-artifact@v4
        with:
          name: GameNexa-release-validation-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 3

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameNexa-android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 3
