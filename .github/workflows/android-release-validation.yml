name: GameNexa Android Release Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Check Android/backend API contract
        run: python3 tests/android_backend_contract_check.py

      - name: Run deep Android/backend/VPS contract audit
        run: python3 tests/deep_release_audit.py

      - name: Validate backend JavaScript syntax
        run: node --check backend/server.js && node --check backend/canonical_routes.js && node --check backend/financialService.js

      - name: Run JVM tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee jvm-test.log

      - name: Upload JVM failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GameNexa-jvm-test-diagnostics
          path: |
            jvm-test.log
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 3

      - name: Prepare stable CI debug signing key
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -keypass android             -alias androiddebugkey             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Require stable release signing credentials
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GAMENEXA_RELEASE_KEYSTORE_BASE64: ${{ secrets.GAMENEXA_RELEASE_KEYSTORE_BASE64 }}
          GAMENEXA_STORE_PASSWORD: ${{ secrets.GAMENEXA_STORE_PASSWORD }}
          GAMENEXA_KEY_ALIAS: ${{ secrets.GAMENEXA_KEY_ALIAS }}
          GAMENEXA_KEY_PASSWORD: ${{ secrets.GAMENEXA_KEY_PASSWORD }}
        run: |
          test -n "$GAMENEXA_RELEASE_KEYSTORE_BASE64" || { echo "::error::Stable release keystore secret is not configured. Refusing to create another ephemeral signing key because Trial identity depends on a stable app signing key."; exit 1; }
          test -n "$GAMENEXA_STORE_PASSWORD" || { echo "::error::GAMENEXA_STORE_PASSWORD is missing."; exit 1; }
          test -n "$GAMENEXA_KEY_ALIAS" || { echo "::error::GAMENEXA_KEY_ALIAS is missing."; exit 1; }
          test -n "$GAMENEXA_KEY_PASSWORD" || { echo "::error::GAMENEXA_KEY_PASSWORD is missing."; exit 1; }

      - name: Restore stable release keystore
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GAMENEXA_RELEASE_KEYSTORE_BASE64: ${{ secrets.GAMENEXA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$GAMENEXA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gamenexa-release.jks"
          test -s "$RUNNER_TEMP/gamenexa-release.jks"

      - name: Build signed Release APK and AAB with stable signing
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GAMENEXA_KEYSTORE_PATH: ${{ runner.temp }}/gamenexa-release.jks
          GAMENEXA_STORE_PASSWORD: ${{ secrets.GAMENEXA_STORE_PASSWORD }}
          GAMENEXA_KEY_ALIAS: ${{ secrets.GAMENEXA_KEY_ALIAS }}
          GAMENEXA_KEY_PASSWORD: ${{ secrets.GAMENEXA_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GameNexa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload Stable Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: GameNexa-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload Stable Release AAB
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: GameNexa-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 3

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameNexa-android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 3
