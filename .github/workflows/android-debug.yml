name: GameNexa Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept SDK licenses and install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Check Android/backend API contract
        run: python3 tests/android_backend_contract_check.py

      - name: Run deep Android/backend/VPS contract audit
        run: python3 tests/deep_release_audit.py

      - name: Validate backend JavaScript syntax
        run: node --check backend/server.js && node --check backend/canonical_routes.js && node --check backend/financialService.js

      - name: Run JVM tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee jvm-test.log

      - name: Upload JVM failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GameNexa-jvm-test-diagnostics
          path: |
            jvm-test.log
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 3

      - name: Restore stable CI debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gamenexa-debug-keystore-v1

      - name: Prepare stable CI debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GameNexa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameNexa-debug-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 1
